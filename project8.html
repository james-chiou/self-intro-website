<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>照片搜尋網站</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="p-2 bg-light rounded-3">
      <div class="container-fluid py-3">
        <h1 class="display-5 fw-bold fs-2 mb-3">Project 8 - 照片搜尋網站</h1>
        <ul class="list-unstyled">
          <li class="col-md-10 fs-5">
            <ol>
              <li class="col-md-10 fs-5 my-2">
                本專案使用React.js作為前端框架，並透過axios套件來實現AJAX透過API向第三方網站請求資料。
              </li>
              <li class="col-md-10 fs-5 my-2">
                本專案的資料來源為Pexels網站，其網站中的照片皆為免費授權的。本專案向Pexels申請API
                Key後，跟據Pexels API規範來設定參數。例如: API
                URL中的頁數、每頁顯示照片數量等。
              </li>
              <li class="col-md-10 fs-5 my-2">
                在網站中，使用者可以透過搜尋得到想要的照片，同時也可以下載想要的照片。
              </li>
              <img style="width: 50%" src="./pictures/project8-1.jpg" alt="" />
              <img style="width: 50%" src="./pictures/project8-2.jpg" alt="" />
            </ol>
          </li>
        </ul>
        <a
          href="https://github.com/james-chiou/picture-search-website"
          target="_blank"
          rel="noreferrer noopenner"
          class="btn btn-primary btn-lg"
          >Github</a
        >
        <a
          href="https://picture-search-website-1.onrender.com"
          target="_blank"
          rel="noreferrer noopenner"
          class="btn btn-primary btn-lg mx-1"
          >前往網站</a
        >
      </div>
    </div>
  </body>
</html>
