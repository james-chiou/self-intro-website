<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google登入網站</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="p-2 bg-light rounded-3">
      <div class="container-fluid py-3">
        <h1 class="display-5 fw-bold fs-2 mb-3">
          Project 7 - Google登入與本地登入系統
        </h1>
        <ul class="list-unstyled">
          <li class="col-md-10 fs-5">
            <ol>
              <li class="col-md-10 fs-5 my-2">
                本專案使用Express.js作為伺服器的框架並搭配EJS生成HTML頁面。並以Passport.js、Authentication、OAuth
                (Google Login Setup)
                實現本地登入以及Google登入。最後在儲存會員資料的部分是使用MongoDB。
              </li>
              <li class="col-md-10 fs-5 my-2">
                使用者點選註冊會員，填寫資料以便進行會員登入。亦或是直接點擊會員登入使用Google登入網站。
              </li>
              <img style="width: 50%" src="./pictures/project7-1.jpg" alt="" />
              <img style="width: 65%" src="./pictures/project7-2.jpg" alt="" />
              <li class="col-md-10 fs-5 my-2">
                登入後，可以在個人檔案頁面上看到自己的資料與已發佈的內容。
                點選發布文章則可以在網站上發布文章。
              </li>
              <img style="width: 50%" src="./pictures/project7-3.jpg" alt="" />
            </ol>
          </li>
        </ul>
        <a
          href="https://github.com/james-chiou/LoginWebsite"
          target="_blank"
          rel="noreferrer noopenner"
          class="btn btn-primary btn-lg"
          >Github</a
        >
        <a
          href="https://loginwebsite-fciz.onrender.com"
          target="_blank"
          rel="noreferrer noopenner"
          class="btn btn-primary btn-lg mx-1"
          >前往網站</a
        >
      </div>
    </div>
  </body>
</html>
